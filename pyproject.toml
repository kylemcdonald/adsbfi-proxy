[project]
name = "adsbfi-proxy"
version = "0.1.0"
description = "Rolling adsb.fi heatmap mirror and SQLite takeoff/landing ledger"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
imports = ["numpy>=1.26"]
evaluation = ["timezonefinder>=6.5"]

[project.scripts]
adsbfi-proxy = "adsbfi_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsbfi_proxy"]
