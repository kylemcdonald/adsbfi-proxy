[project]
name = "adsbfi-proxy"
version = "0.1.0"
description = "Rolling ADS-B Exchange heatmap mirror and SQLite flight database"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
imports = ["numpy>=1.26"]

[project.scripts]
adsbfi-proxy = "adsbfi_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsbfi_proxy"]
