<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Observed airport movements</title>
<style>body{font:16px system-ui;background:#101922;color:#e7eef7;max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:30px}p{color:#aebfce;line-height:1.5}form{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px}input,select,button{font:inherit;padding:9px;background:#223345;color:inherit;border:1px solid #52667b;border-radius:5px}button{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:12px;text-align:left;border-bottom:1px solid #314254}#rows{overflow:auto}a{color:#80cce6}</style>
<h1>Observed airport movements</h1><p>Independent takeoffs and landings · endpoint ledger v5. Short aircraft histories can corroborate missing movements. Times identify supporting observations, not exact runway crossings.</p>
<form id="filters"><label>Airport<input name="airport" placeholder="KMIA"></label><label>Aircraft<input name="aircraft" placeholder="ICAO or registration"></label><label>Callsign<input name="callsign" placeholder="UAL123"></label><label>From UTC<input type="date" name="start"></label><label>Before UTC<input type="date" name="end"></label><label>Movement<select name="kind"><option value="">Both</option><option>takeoff</option><option>landing</option></select></label><button>Search</button></form>
<p id="status" role="status"></p><div id="rows"></div><p><button id="next" hidden>Next page</button> <a href="api/endpoints">JSON feed</a></p>
<script>
let cursor=0,filters=new URLSearchParams();const status=document.querySelector('#status'),next=document.querySelector('#next');
async function load(){next.disabled=true;status.textContent='Loading…';try{const q=new URLSearchParams(filters);q.set('after_id',cursor);q.set('limit',100);const response=await fetch('api/endpoints?'+q);const data=await response.json();if(!response.ok)throw Error(data.error);const table=document.createElement('table'),head=table.createTHead().insertRow();for(const title of ['UTC time','Aircraft','Callsign','Airport','Movement']){const th=document.createElement('th');th.textContent=title;head.append(th)}const body=table.createTBody();for(const r of data.endpoints){const tr=body.insertRow();for(const value of [r.time,r.registration||r.icao,r.callsign||'',r.airport,r.kind])tr.insertCell().textContent=value}document.querySelector('#rows').replaceChildren(table);cursor=data.next_after_id;next.hidden=!data.has_more;status.textContent=`${data.endpoints.length} movements · ordered by insertion ID · watermark ${data.snapshot_id}`;}catch(e){status.textContent=e.message}finally{next.disabled=false}}
document.querySelector('form').onsubmit=e=>{e.preventDefault();filters=new URLSearchParams(new FormData(e.target));cursor=0;load()};next.onclick=load;load();
</script></html>
